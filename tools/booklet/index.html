<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PDFを選ぶと小冊子用にページ組み換え。ブラウザ完結。" />
  <title>PDF小冊子メーカー | HAKONIWA</title>
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #0c1210; --surface: #141c18; --text: #e8ebe6; --muted: #8a9488;
      --accent: #5dade2; --accent-dim: color-mix(in srgb, #5dade2 18%, transparent);
      --ok: #4a9a5a; --border: rgba(255,255,255,0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      padding: 1.25rem; line-height: 1.55;
    }
    .wrap { max-width: 640px; margin: 0 auto; }
    a.back { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
    a.back:hover { color: var(--accent); }
    h1 { font-size: 1.35rem; margin: 1rem 0 0.35rem; font-weight: 700; }
    .lead { color: var(--muted); font-size: 0.92rem; margin-bottom: 1.5rem; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 1.25rem; margin-bottom: 1rem;
    }
    .drop {
      position: relative; border: 2px dashed var(--border); border-radius: 12px;
      padding: 2rem 1rem; text-align: center; cursor: pointer;
      transition: border-color 0.2s, background 0.2s; overflow: hidden;
    }
    .drop:hover, .drop.dragover, .drop.has-file {
      border-color: var(--accent); background: var(--accent-dim);
    }
    .drop input[type="file"] {
      position: absolute; inset: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer; font-size: 0; z-index: 2;
    }
    .drop-icon { font-size: 2rem; margin-bottom: 0.5rem; pointer-events: none; }
    .drop p { color: var(--muted); font-size: 0.9rem; pointer-events: none; }
    .drop strong { color: var(--text); }
    .btn-select {
      display: inline-block; margin-top: 0.85rem; padding: 0.55rem 1.1rem;
      background: var(--accent); color: #0a1010; border: none; border-radius: 8px;
      font-size: 0.9rem; font-weight: 600; pointer-events: none;
    }
    .btn-pick {
      display: block; width: 100%; margin-top: 0.75rem; padding: 0.75rem 1rem;
      background: var(--accent); color: #0a1010; border: none; border-radius: 10px;
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
    }
    .btn-pick:hover { filter: brightness(1.08); }
    label.opt {
      display: flex; align-items: flex-start; gap: 0.6rem;
      margin: 0.75rem 0; cursor: pointer; font-size: 0.92rem;
    }
    label.opt input { margin-top: 0.2rem; accent-color: var(--accent); }
    label.opt span.hint { display: block; color: var(--muted); font-size: 0.8rem; margin-top: 0.15rem; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 100%; padding: 0.85rem 1.2rem; border: none; border-radius: 10px;
      font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #0a1010; }
    .btn-ghost {
      background: transparent; color: var(--muted); border: 1px solid var(--border); margin-top: 0.6rem;
    }
    .status {
      margin-top: 1rem; padding: 0.75rem 1rem; border-radius: 10px;
      font-size: 0.9rem; display: none; word-break: break-word;
    }
    .status.show { display: block; }
    .status.info { background: var(--accent-dim); color: var(--accent); }
    .status.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: #7dcea0; }
    .status.err { background: color-mix(in srgb, #e74c3c 18%, transparent); color: #f1948a; }
    .meta { margin-top: 0.75rem; font-size: 0.85rem; color: var(--muted); }
    .meta strong { color: var(--text); }
    details.help {
      margin-top: 1.25rem; border: 1px solid var(--border); border-radius: 12px;
      padding: 0.85rem 1rem; background: var(--surface);
    }
    details.help summary { cursor: pointer; font-weight: 600; }
    details.help .body { margin-top: 0.75rem; color: var(--muted); font-size: 0.88rem; }
    details.help ol { padding-left: 1.2rem; margin: 0.5rem 0; }
    .order-preview {
      font-family: ui-monospace, monospace; font-size: 0.78rem; background: #0a100e;
      border-radius: 8px; padding: 0.6rem 0.75rem; margin-top: 0.6rem;
      max-height: 140px; overflow: auto; white-space: pre-wrap; color: #a8b5a4; display: none;
    }
    .order-preview.show { display: block; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="../../">← HAKONIWA</a>
    <h1>PDF小冊子メーカー</h1>
    <p class="lead">PDFを選ぶと、中綴じ小冊子用にページを組み換えてダウンロードします。すべて端末内で処理します。</p>

    <div class="card">
      <div class="drop" id="drop">
        <div class="drop-icon" id="dropIcon">📄</div>
        <p id="dropText"><strong>ここをタップ／クリック</strong></p>
        <p style="margin-top:0.35rem;font-size:0.82rem;" id="dropHint">または下のボタンから選択</p>
        <span class="btn-select">PDFを選択</span>
        <input type="file" id="file" accept="application/pdf,.pdf,application/x-pdf" />
      </div>
      <button type="button" class="btn-pick" id="pickBtn">ファイルを選ぶ</button>
      <div class="meta" id="fileMeta"></div>
    </div>

    <div class="card">
      <label class="opt">
        <input type="radio" name="mode" value="impose" checked />
        <span>2-up 面付け（推奨）
          <span class="hint">左右2ページ配置。両面印刷→中央で折ると冊子に。</span>
        </span>
      </label>
      <label class="opt">
        <input type="radio" name="mode" value="reorder" />
        <span>ページ順のみ並べ替え
          <span class="hint">サイズそのまま。プリンタの小冊子印刷向け。</span>
        </span>
      </label>
      <label class="opt">
        <input type="checkbox" id="padBlanks" checked />
        <span>4の倍数になるよう空白ページを追加
          <span class="hint">中綴じは総ページ数が4の倍数である必要があります。</span>
        </span>
      </label>
      <div class="order-preview" id="orderPreview"></div>
      <button class="btn btn-primary" id="runBtn" disabled>小冊子用PDFを作成</button>
      <button class="btn btn-ghost" id="resetBtn" style="display:none;">別のPDFを選ぶ</button>
      <div class="status" id="status"></div>
    </div>

    <details class="help">
      <summary>使い方</summary>
      <div class="body">
        <ol>
          <li>枠または「ファイルを選ぶ」からPDFを選択</li>
          <li>「作成」でダウンロード</li>
          <li>両面印刷（短辺とじ）→中央で折る</li>
        </ol>
      </div>
    </details>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script>
  (function () {
    "use strict";
    var drop = document.getElementById("drop");
    var fileInput = document.getElementById("file");
    var pickBtn = document.getElementById("pickBtn");
    var fileMeta = document.getElementById("fileMeta");
    var runBtn = document.getElementById("runBtn");
    var resetBtn = document.getElementById("resetBtn");
    var statusEl = document.getElementById("status");
    var orderPreview = document.getElementById("orderPreview");
    var padBlanks = document.getElementById("padBlanks");
    var dropIcon = document.getElementById("dropIcon");
    var dropText = document.getElementById("dropText");
    var dropHint = document.getElementById("dropHint");
    var pdfBytes = null;
    var fileName = "document.pdf";
    var originalPageCount = 0;

    function setStatus(type, msg) {
      statusEl.className = "status show " + type;
      statusEl.textContent = msg;
    }
    function clearStatus() {
      statusEl.className = "status";
      statusEl.textContent = "";
    }
    function ensurePdfLib() {
      if (typeof PDFLib === "undefined" || !PDFLib.PDFDocument) {
        setStatus("err", "PDFライブラリの読み込みに失敗。再読み込みか別回線で試してください。");
        return false;
      }
      return true;
    }
    function computeBookletOrder(N) {
      var order = [];
      for (var k = 0; k < N / 4; k++) {
        order.push(N - 2 * k, 2 * k + 1, 2 * k + 2, N - 2 * k - 1);
      }
      return order;
    }
    function pad4(n) { return Math.ceil(n / 4) * 4; }
    function showOrderPreview(n, padded) {
      if (!n) { orderPreview.classList.remove("show"); return; }
      var total = padBlanks.checked ? padded : n;
      if (total % 4 !== 0) {
        orderPreview.textContent = n + "ページ。4の倍数（" + padded + "）推奨。";
        orderPreview.classList.add("show");
        return;
      }
      var order = computeBookletOrder(total);
      var lines = [];
      for (var s = 0; s < order.length; s += 4) {
        var fmt = function (p) { return p > n ? "空白" : String(p); };
        lines.push("シート" + (s/4+1) + " 表:[" + fmt(order[s]) + "|" + fmt(order[s+1]) +
          "] 裏:[" + fmt(order[s+2]) + "|" + fmt(order[s+3]) + "]");
      }
      orderPreview.textContent = lines.join("\n");
      orderPreview.classList.add("show");
    }
    function esc(s) {
      return String(s).replace(/&/g, "\u0026amp;").replace(/</g, "\u0026lt;")
        .replace(/>/g, "\u0026gt;").replace(/"/g, "\u0026quot;");
    }
    function isLikelyPdf(file) {
      if (!file) return false;
      var name = (file.name || "").toLowerCase();
      var type = (file.type || "").toLowerCase();
      if (type.indexOf("pdf") >= 0) return true;
      if (name.endsWith(".pdf")) return true;
      if (!type) return true;
      return false;
    }
    function onFile(file) {
      if (!file) { setStatus("err", "ファイルが渡されませんでした"); return; }
      fileMeta.innerHTML = "選択中: <strong>" + esc(file.name || "?") + "</strong> — 読み込み中…";
      drop.classList.add("has-file");
      dropIcon.textContent = "⏳";
      dropText.innerHTML = "<strong>" + esc(file.name || "ファイル") + "</strong>";
      dropHint.textContent = "読み込み中…";
      setStatus("info", "受け取りました（" + (file.size || 0) + " bytes）。解析中…");

      if (!isLikelyPdf(file)) {
        setStatus("err", "PDFではなさそうです: " + (file.name||"") + " type=" + (file.type||"空"));
        dropIcon.textContent = "📄";
        return;
      }
      if (!ensurePdfLib()) { dropIcon.textContent = "📄"; return; }

      fileName = file.name || "document.pdf";
      var reader = new FileReader();
      reader.onerror = function () {
        setStatus("err", "FileReader失敗");
        pdfBytes = null; runBtn.disabled = true; dropIcon.textContent = "📄";
      };
      reader.onload = function () {
        var result = reader.result;
        if (!result) { setStatus("err", "内容が空"); return; }
        var bytes = new Uint8Array(result);
        var head = "";
        for (var i = 0; i < Math.min(5, bytes.length); i++) head += String.fromCharCode(bytes[i]);
        if (head.indexOf("%PDF") !== 0) {
          setStatus("err", "PDF形式ではありません（先頭: " + head + "）");
          dropIcon.textContent = "📄"; pdfBytes = null; runBtn.disabled = true;
          return;
        }
        pdfBytes = bytes;
        PDFLib.PDFDocument.load(pdfBytes, { ignoreEncryption: true }).then(function (doc) {
          originalPageCount = doc.getPageCount();
          if (!originalPageCount) {
            setStatus("err", "ページなし"); pdfBytes = null; runBtn.disabled = true; dropIcon.textContent = "📄";
            return;
          }
          var padded = pad4(originalPageCount);
          fileMeta.innerHTML = "選択中: <strong>" + esc(fileName) + "</strong> — " +
            originalPageCount + " ページ" +
            (padded > originalPageCount ? "（空白追加で " + padded + " ページ）" : "");
          runBtn.disabled = false;
          resetBtn.style.display = "block";
          showOrderPreview(originalPageCount, padded);
          dropIcon.textContent = "✅";
          dropHint.textContent = originalPageCount + " ページ読み込み完了";
          setStatus("info", "準備完了。「作成」を押してください。");
        }).catch(function (e) {
          console.error(e);
          setStatus("err", "解析失敗: " + (e && e.message ? e.message : e));
          pdfBytes = null; runBtn.disabled = true; dropIcon.textContent = "📄";
        });
      };
      reader.readAsArrayBuffer(file);
    }

    fileInput.addEventListener("change", function () {
      if (fileInput.files && fileInput.files[0]) onFile(fileInput.files[0]);
      else setStatus("err", "選択キャンセルされた可能性があります");
    });
    pickBtn.addEventListener("click", function () { fileInput.click(); });

    ["dragenter","dragover"].forEach(function (ev) {
      drop.addEventListener(ev, function (e) {
        e.preventDefault(); e.stopPropagation(); drop.classList.add("dragover");
      });
    });
    ["dragleave","drop"].forEach(function (ev) {
      drop.addEventListener(ev, function (e) {
        e.preventDefault(); e.stopPropagation(); drop.classList.remove("dragover");
      });
    });
    drop.addEventListener("drop", function (e) {
      var f = e.dataTransfer && e.dataTransfer.files;
      if (f && f[0]) onFile(f[0]);
    });

    padBlanks.addEventListener("change", function () {
      if (originalPageCount > 0) showOrderPreview(originalPageCount, pad4(originalPageCount));
    });

    resetBtn.addEventListener("click", function () {
      pdfBytes = null; originalPageCount = 0; fileInput.value = "";
      fileMeta.innerHTML = ""; runBtn.disabled = true; resetBtn.style.display = "none";
      orderPreview.classList.remove("show"); drop.classList.remove("has-file");
      dropIcon.textContent = "📄";
      dropText.innerHTML = "<strong>ここをタップ／クリック</strong>";
      dropHint.textContent = "または下のボタンから選択";
      clearStatus();
    });

    runBtn.addEventListener("click", function () {
      if (!pdfBytes || !ensurePdfLib()) return;
      runBtn.disabled = true;
      setStatus("info", "処理中…");
      var mode = document.querySelector('input[name="mode"]:checked').value;
      var doPad = padBlanks.checked;

      PDFLib.PDFDocument.load(pdfBytes, { ignoreEncryption: true }).then(function (srcDoc) {
        var n = srcDoc.getPageCount();
        var total = doPad ? pad4(n) : n;
        if (total % 4 !== 0) total = pad4(n);
        var order = computeBookletOrder(total);
        var sz = srcDoc.getPage(0).getSize();
        var W = sz.width, H = sz.height;

        if (mode === "reorder") {
          return PDFLib.PDFDocument.create().then(function (out) {
            var chain = Promise.resolve();
            for (var i = 0; i < order.length; i++) {
              (function (p) {
                chain = chain.then(function () {
                  if (p > n) { out.addPage([W, H]); return; }
                  return out.copyPages(srcDoc, [p - 1]).then(function (cp) { out.addPage(cp[0]); });
                });
              })(order[i]);
            }
            return chain.then(function () {
              return out.save().then(function (bytes) {
                dl(bytes, baseName(fileName) + "_booklet_reorder.pdf");
                setStatus("ok", "完了: " + out.getPageCount() + " ページ");
              });
            });
          });
        }

        return PDFLib.PDFDocument.create().then(function (out) {
          var needed = [], seen = {};
          for (var i = 0; i < order.length; i++) {
            var p = order[i];
            if (p <= n && !seen[p - 1]) { seen[p - 1] = 1; needed.push(p - 1); }
          }
          needed.sort(function (a, b) { return a - b; });
          return out.embedPdf(srcDoc, needed).then(function (emb) {
            var map = {};
            for (var i = 0; i < needed.length; i++) map[needed[i]] = emb[i];
            for (var s = 0; s < order.length; s += 4) {
              var fl = order[s], fr = order[s+1], bl = order[s+2], br = order[s+3];
              var front = out.addPage([W * 2, H]);
              if (fl <= n && map[fl - 1]) front.drawPage(map[fl - 1], { x: 0, y: 0, width: W, height: H });
              if (fr <= n && map[fr - 1]) front.drawPage(map[fr - 1], { x: W, y: 0, width: W, height: H });
              var back = out.addPage([W * 2, H]);
              if (bl <= n && map[bl - 1]) back.drawPage(map[bl - 1], { x: 0, y: 0, width: W, height: H });
              if (br <= n && map[br - 1]) back.drawPage(map[br - 1], { x: W, y: 0, width: W, height: H });
            }
            return out.save().then(function (bytes) {
              dl(bytes, baseName(fileName) + "_booklet_impose.pdf");
              setStatus("ok", "完了: " + out.getPageCount() + " シート。両面印刷して折ってください。");
            });
          });
        });
      }).catch(function (e) {
        console.error(e);
        setStatus("err", "失敗: " + (e && e.message ? e.message : e));
      }).then(function () { runBtn.disabled = false; });
    });

    function baseName(name) { return name.replace(/\.pdf$/i, "") || "document"; }
    function dl(bytes, name) {
      var blob = new Blob([bytes], { type: "application/pdf" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    }

    setTimeout(function () {
      if (typeof PDFLib === "undefined") {
        setStatus("err", "pdf-lib を読み込めません。CDNがブロックされている可能性があります。");
      }
    }, 3000);
  })();
  </script>
</body>
</html>
