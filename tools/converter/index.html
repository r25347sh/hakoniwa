<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>単位変換 | HAKONIWA</title>
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <style>
    :root { --bg:#0c1210; --text:#e8ebe6; --muted:#8a9488; --accent:#5dade2; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:1.5rem; max-width:480px; margin:0 auto; }
    a.back { color:var(--muted); text-decoration:none; font-size:0.9rem; }
    h1 { font-size:1.3rem; margin:1rem 0; }
    label { display:block; color:var(--muted); font-size:0.85rem; margin:0.75rem 0 0.35rem; }
    select, input {
      width:100%; padding:0.7rem 0.9rem; border-radius:10px; border:1px solid rgba(255,255,255,0.12);
      background:#141c18; color:var(--text); font-size:1rem;
    }
    .arrow { text-align:center; margin:1rem 0; color:var(--accent); font-size:1.5rem; }
    .result { font-size:1.75rem; font-weight:700; text-align:center; margin-top:1.5rem; color:var(--accent); font-variant-numeric:tabular-nums; }
  </style>
</head>
<body>
  <a class="back" href="../../">← HAKONIWA</a>
  <h1>単位変換</h1>
  <label>種類</label>
  <select id="cat"></select>
  <label>値</label>
  <input type="number" id="val" value="1" step="any" />
  <label>変換元</label>
  <select id="from"></select>
  <div class="arrow">↓</div>
  <label>変換先</label>
  <select id="to"></select>
  <div class="result" id="out">—</div>
  <script>
    const UNITS = {
      "長さ": { m:1, km:1000, cm:0.01, mm:0.001, マイル:1609.34, ヤード:0.9144, フィート:0.3048, インチ:0.0254 },
      "質量": { kg:1, g:0.001, mg:0.000001, t:1000, ポンド:0.453592, オンス:0.0283495 },
      "温度": { "℃":"c", "℉":"f", "K":"k" },
      "体積": { L:1, mL:0.001, "m³":1000, カップ:0.24, ガロン:3.78541 },
      "面積": { "m²":1, "km²":1e6, "cm²":0.0001, ヘクタール:10000, 坪:3.30579 },
      "速度": { "m/s":1, "km/h":1/3.6, mph:0.44704, ノット:0.514444 },
    };
    const cat = document.getElementById("cat");
    const from = document.getElementById("from");
    const to = document.getElementById("to");
    const val = document.getElementById("val");
    const out = document.getElementById("out");
    Object.keys(UNITS).forEach(k => {
      const o = document.createElement("option"); o.value = k; o.textContent = k; cat.appendChild(o);
    });
    function fillUnits() {
      const u = UNITS[cat.value];
      from.innerHTML = to.innerHTML = "";
      Object.keys(u).forEach(k => {
        from.innerHTML += `<option value="${k}">${k}</option>`;
        to.innerHTML += `<option value="${k}">${k}</option>`;
      });
      to.selectedIndex = Math.min(1, Object.keys(u).length - 1);
      calc();
    }
    function calc() {
      const v = parseFloat(val.value);
      if (isNaN(v)) { out.textContent = "—"; return; }
      if (cat.value === "温度") {
        let c;
        if (from.value === "℃") c = v;
        else if (from.value === "℉") c = (v - 32) * 5/9;
        else c = v - 273.15;
        let r;
        if (to.value === "℃") r = c;
        else if (to.value === "℉") r = c * 9/5 + 32;
        else r = c + 273.15;
        out.textContent = r.toFixed(2) + " " + to.value;
        return;
      }
      const base = v * UNITS[cat.value][from.value];
      const r = base / UNITS[cat.value][to.value];
      out.textContent = (Math.abs(r) >= 1000 || (Math.abs(r) < 0.01 && r !== 0) ? r.toExponential(4) : +r.toPrecision(6)) + " " + to.value;
    }
    cat.onchange = fillUnits;
    from.onchange = to.onchange = val.oninput = calc;
    fillUnits();
  </script>
</body>
</html>
