<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Quick Share | HAKONIWA</title>
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho:wght@600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #0a100e; --card: #121a16; --text: #e8ebe6; --muted: #7a8678;
      --green: #6bc46b; --green-dim: rgba(107, 196, 107, 0.15); --blue: #5dade2;
      --radius: 20px; --font: "Zen Kaku Gothic New", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
    a.back { position: fixed; top: 1rem; left: 1rem; z-index: 20; color: var(--muted); text-decoration: none; font-size: 0.85rem; }
    a.back:hover { color: var(--text); }
    #lobby {
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 2rem 1.25rem; text-align: center;
    }
    #lobby h1 { font-family: "Shippori Mincho", serif; font-size: 1.75rem; letter-spacing: 0.08em; margin-bottom: 0.4rem; }
    #lobby .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 2rem; max-width: 20em; }
    .radar { position: relative; width: 200px; height: 200px; margin: 0 auto 2rem; }
    .radar-ring {
      position: absolute; inset: 0; border: 2px solid rgba(107, 196, 107, 0.2); border-radius: 50%;
      animation: radar-pulse 2.4s ease-out infinite;
    }
    .radar-ring:nth-child(2) { animation-delay: 0.8s; }
    .radar-ring:nth-child(3) { animation-delay: 1.6s; }
    .radar-core {
      position: absolute; inset: 35%; background: linear-gradient(145deg, var(--green), #3d8a3d);
      border-radius: 50%; display: grid; place-items: center; font-size: 2rem;
      box-shadow: 0 0 40px rgba(107, 196, 107, 0.4); animation: core-breathe 3s ease-in-out infinite;
    }
    @keyframes radar-pulse { 0% { transform: scale(0.4); opacity: 0.8; } 100% { transform: scale(1.15); opacity: 0; } }
    @keyframes core-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    .name-field {
      width: min(100%, 260px); background: var(--card); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px; padding: 0.75rem 1.1rem; color: var(--text); font: inherit;
      text-align: center; margin-bottom: 1.25rem; outline: none;
    }
    .name-field:focus { border-color: var(--green); }
    .lobby-btns { display: flex; flex-direction: column; gap: 0.65rem; width: min(100%, 280px); }
    button {
      font-family: inherit; cursor: pointer; border: none; border-radius: 999px;
      padding: 0.85rem 1.4rem; font-size: 0.95rem; font-weight: 600;
      transition: transform 0.15s, filter 0.15s;
    }
    button:active { transform: scale(0.97); }
    .btn-main {
      background: linear-gradient(135deg, var(--green), #4a9a4a); color: #0a100e;
      box-shadow: 0 8px 28px rgba(107, 196, 107, 0.3);
    }
    .btn-main:hover { filter: brightness(1.08); }
    .btn-sub { background: rgba(255,255,255,0.06); color: var(--text); border: 1px solid rgba(255,255,255,0.1); }
    .btn-sub:hover { background: rgba(255,255,255,0.1); }
    #share { display: none; min-height: 100vh; padding: 3.5rem 1rem 2rem; max-width: 520px; margin: 0 auto; }
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.25rem; gap: 0.75rem; flex-wrap: wrap;
    }
    .status-pill {
      display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.35rem 0.75rem;
      border-radius: 999px; font-size: 0.8rem; background: var(--green-dim); color: var(--green);
    }
    .status-pill .dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--green);
      box-shadow: 0 0 8px var(--green); animation: blink 1.5s infinite;
    }
    .status-pill.wait { color: #f5b041; background: rgba(245,176,65,0.12); }
    .status-pill.wait .dot { background: #f5b041; box-shadow: none; }
    @keyframes blink { 50% { opacity: 0.4; } }
    .room-tag { font-size: 0.85rem; color: var(--muted); letter-spacing: 0.12em; font-weight: 600; }
    .drop-zone {
      position: relative; border: 2px dashed rgba(107, 196, 107, 0.35); border-radius: var(--radius);
      background: var(--card); padding: 2.5rem 1.5rem; text-align: center; cursor: pointer;
      transition: border-color 0.2s, background 0.2s, transform 0.2s; overflow: hidden;
    }
    .drop-zone.drag { border-color: var(--green); background: rgba(107, 196, 107, 0.08); transform: scale(1.02); }
    .drop-zone .icon {
      position: relative; font-size: 2.8rem; margin-bottom: 0.75rem; display: block;
      animation: float-icon 3s ease-in-out infinite;
    }
    @keyframes float-icon { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .drop-zone h2 { position: relative; font-size: 1.1rem; font-weight: 700; margin-bottom: 0.35rem; }
    .drop-zone p { position: relative; color: var(--muted); font-size: 0.85rem; }
    #file-input { display: none; }
    .section-label {
      font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted); margin: 1.5rem 0 0.75rem;
    }
    .devices { display: flex; flex-direction: column; gap: 0.6rem; }
    .device {
      display: flex; align-items: center; gap: 0.85rem; padding: 0.85rem 1rem;
      background: var(--card); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
      animation: slide-in 0.35s ease;
    }
    @keyframes slide-in { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
    .device-avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(145deg, var(--blue), #3a7ca5);
      display: grid; place-items: center; font-weight: 700; font-size: 1rem; flex-shrink: 0;
    }
    .device-avatar.me { background: linear-gradient(145deg, var(--green), #3d8a3d); }
    .device-info { flex: 1; min-width: 0; }
    .device-info .name { font-weight: 600; font-size: 0.95rem; }
    .device-info .meta { font-size: 0.75rem; color: var(--muted); }
    .device.empty { justify-content: center; color: var(--muted); font-size: 0.85rem; border-style: dashed; }
    .transfer {
      display: flex; align-items: center; gap: 0.85rem; padding: 0.85rem 1rem;
      background: var(--card); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
      margin-bottom: 0.5rem; animation: slide-in 0.35s ease;
    }
    .transfer-icon {
      width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.06);
      display: grid; place-items: center; font-size: 1.3rem; flex-shrink: 0;
    }
    .transfer-body { flex: 1; min-width: 0; }
    .transfer-body .fname {
      font-size: 0.9rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .transfer-body .fmeta { font-size: 0.75rem; color: var(--muted); margin-top: 0.15rem; }
    .progress { height: 4px; border-radius: 2px; background: rgba(255,255,255,0.08); margin-top: 0.45rem; overflow: hidden; }
    .progress > i {
      display: block; height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--green), var(--blue)); border-radius: 2px; transition: width 0.25s ease;
    }
    .transfer a.dl { color: var(--green); font-size: 0.8rem; font-weight: 600; text-decoration: none; white-space: nowrap; }
    .share-panel {
      margin-top: 1.5rem; padding: 1.25rem; background: var(--card); border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.08); text-align: center;
    }
    .share-panel p { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.85rem; }
    #qr {
      width: 168px; height: 168px; margin: 0 auto 1rem;
      background: #fff; border-radius: 12px; padding: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    #qr img { width: 100%; height: 100%; object-fit: contain; display: block; border-radius: 4px; }
    .share-actions { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }
    .share-actions button { font-size: 0.85rem; padding: 0.6rem 1.1rem; }
    .toast {
      position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(80px);
      background: #1e2a22; color: var(--text); padding: 0.7rem 1.3rem; border-radius: 999px;
      font-size: 0.85rem; border: 1px solid rgba(107,196,107,0.3); opacity: 0; transition: 0.3s ease;
      z-index: 50; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <a class="back" href="../../">← HAKONIWA</a>
  <div id="lobby">
    <div class="radar" aria-hidden="true">
      <div class="radar-ring"></div><div class="radar-ring"></div><div class="radar-ring"></div>
      <div class="radar-core">📡</div>
    </div>
    <h1>Quick Share</h1>
    <p class="sub">近くの端末へ、ファイルをすばやく送る。<br />Android の Quick Share のような感覚で。</p>
    <input class="name-field" id="name" maxlength="16" placeholder="あなたの名前" />
    <div class="lobby-btns">
      <button class="btn-main" id="btn-host">受信を開始（ホスト）</button>
      <button class="btn-sub" id="btn-join" style="display:none">このリンクの相手に接続</button>
    </div>
  </div>
  <div id="share">
    <div class="top-bar">
      <span class="status-pill wait" id="status"><span class="dot"></span><span id="status-text">準備中…</span></span>
      <span class="room-tag" id="room-tag"></span>
    </div>
    <div class="drop-zone" id="drop" tabindex="0" role="button">
      <span class="icon">📂</span>
      <h2>ファイルを送る</h2>
      <p>タップして選択、またはここにドロップ</p>
    </div>
    <input type="file" id="file-input" multiple />
    <p class="section-label">つながっている端末</p>
    <div class="devices" id="devices"><div class="device empty">まだ相手がいません</div></div>
    <p class="section-label" id="tx-label" style="display:none">送受信</p>
    <div id="transfers"></div>
    <div class="share-panel">
      <p>相手にこのQRを読み取ってもらうか、<br />リンクを送って接続してもらいます</p>
      <div id="qr"></div>
      <div class="share-actions">
        <button class="btn-main" id="btn-copy">リンクをコピー</button>
        <button class="btn-sub" id="btn-leave">終了</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script>
(() => {
  "use strict";
  const PREFIX = "hkqs-", MAX = 6 * 1024 * 1024;
  const $ = (s) => document.querySelector(s);
  const lobby = $("#lobby"), share = $("#share"), devicesEl = $("#devices");
  const transfersEl = $("#transfers"), drop = $("#drop"), fileInput = $("#file-input");
  const statusEl = $("#status"), statusText = $("#status-text");
  let peer = null, room = null, myId = null, isHost = false, myName = "";
  const peers = new Map();

  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200);
  }
  function code(n = 6) {
    const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", a = new Uint8Array(n);
    crypto.getRandomValues(a); return [...a].map((x) => c[x % c.length]).join("");
  }
  function setStatus(kind, text) {
    statusEl.className = "status-pill" + (kind === "ok" ? "" : " wait");
    statusText.textContent = text;
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&", "<": "<", ">": ">", '"': """, "'": "&#39;" }[c]));
  }
  function renderDevices() {
    devicesEl.innerHTML = "";
    const me = document.createElement("div"); me.className = "device";
    me.innerHTML = '<div class="device-avatar me">' + (myName || "?").slice(0, 1) + '</div><div class="device-info"><div class="name">' + escapeHtml(myName) + '（自分）</div><div class="meta">' + (isHost ? "ホスト · 受信待機中" : "接続済み") + '</div></div>';
    devicesEl.appendChild(me);
    if (!peers.size) {
      const empty = document.createElement("div"); empty.className = "device empty";
      empty.textContent = "相手を待っています… QRまたはリンクを共有"; devicesEl.appendChild(empty); return;
    }
    peers.forEach((p) => {
      const d = document.createElement("div"); d.className = "device";
      d.innerHTML = '<div class="device-avatar">' + (p.name || "?").slice(0, 1) + '</div><div class="device-info"><div class="name">' + escapeHtml(p.name || "端末") + '</div><div class="meta">接続中 · ファイルを送れます</div></div>';
      devicesEl.appendChild(d);
    });
  }
  function hostId(r) { return PREFIX + r + "-host"; }
  function wire(conn) {
    conn.on("open", () => {
      peers.set(conn.peer, { conn, name: "端末" }); renderDevices();
      setStatus("ok", peers.size + " 台と接続中");
      conn.send(JSON.stringify({ t: "hi", name: myName })); toast("端末がつながりました");
    });
    conn.on("data", (raw) => {
      let msg; try { msg = typeof raw === "string" ? JSON.parse(raw) : raw; } catch { return; }
      if (msg.t === "hi") {
        const p = peers.get(conn.peer); if (p) p.name = msg.name || "端末"; renderDevices();
        conn.send(JSON.stringify({ t: "hi-ok", name: myName }));
      } else if (msg.t === "hi-ok") {
        const p = peers.get(conn.peer); if (p) p.name = msg.name || "端末"; renderDevices();
      } else if (msg.t === "file") receiveFile(msg, conn.peer);
    });
    conn.on("close", () => {
      peers.delete(conn.peer); renderDevices();
      setStatus(peers.size ? "ok" : "wait", peers.size ? peers.size + " 台と接続中" : "待機中");
      toast("端末が切断されました");
    });
  }
  function connectTo(id) {
    if (!peer || id === myId || peers.has(id)) return;
    try { wire(peer.connect(id, { reliable: true })); } catch (_) {}
  }
  function startHost(r) {
    isHost = true; myId = hostId(r); peer = new Peer(myId, { debug: 0 });
    peer.on("open", () => { setStatus("ok", "受信待機中"); toast("準備完了 — QRまたはリンクを共有してください"); });
    peer.on("connection", wire);
    peer.on("error", (err) => {
      if (err && (err.type === "unavailable-id" || String(err).includes("taken"))) { destroy(); startGuest(r); }
      else { setStatus("wait", "エラー"); toast("接続エラー: " + (err.type || err)); }
    });
  }
  function startGuest(r) {
    isHost = false; myId = PREFIX + r + "-" + code(4).toLowerCase();
    peer = new Peer(myId, { debug: 0 });
    peer.on("open", () => {
      setStatus("wait", "接続中…"); connectTo(hostId(r));
      let n = 0;
      const iv = setInterval(() => { if (peers.size || ++n > 10) { clearInterval(iv); return; } connectTo(hostId(r)); }, 1200);
    });
    peer.on("connection", wire);
    peer.on("error", (err) => { setStatus("wait", "エラー"); toast("接続エラー: " + (err.type || err)); });
  }
  function destroy() {
    peers.forEach((p) => { try { p.conn.close(); } catch {} }); peers.clear();
    if (peer) { try { peer.destroy(); } catch {} peer = null; }
  }

  /** QR: 外部API画像（CDNライブラリ不要・確実） */
  function drawQR(text) {
    const box = $("#qr");
    box.innerHTML = "";
    const img = document.createElement("img");
    img.alt = "接続用QRコード";
    img.width = 152;
    img.height = 152;
    // 複数プロバイダをフォールバック
    const sources = [
      "https://api.qrserver.com/v1/create-qr-code/?size=152x152&margin=8&data=" + encodeURIComponent(text),
      "https://quickchart.io/qr?size=152&text=" + encodeURIComponent(text),
    ];
    let i = 0;
    img.onerror = () => {
      i++;
      if (i < sources.length) img.src = sources[i];
      else box.innerHTML = '<p style="font-size:0.75rem;color:#666;padding:0.5rem;text-align:center">QRを表示できません。<br>下の「リンクをコピー」を使ってください</p>';
    };
    img.src = sources[0];
    box.appendChild(img);
  }

  function enter(r) {
    room = r.toUpperCase(); myName = ($("#name").value || "").trim() || "端末" + code(2);
    lobby.style.display = "none"; share.style.display = "block";
    $("#room-tag").textContent = "ROOM " + room;
    const url = new URL(location.href); url.searchParams.set("room", room); history.replaceState(null, "", url);
    drawQR(url.toString()); renderDevices(); startHost(room);
  }
  function sizeLabel(n) {
    if (n < 1024) return n + " B"; if (n < 1048576) return (n / 1024).toFixed(1) + " KB"; return (n / 1048576).toFixed(1) + " MB";
  }
  function addTransfer({ name, size, direction, progress }) {
    $("#tx-label").style.display = "block";
    const el = document.createElement("div"); el.className = "transfer";
    const icon = /\.(png|jpe?g|gif|webp|svg)$/i.test(name) ? "🖼" : /\.(mp4|webm|mov)$/i.test(name) ? "🎬" : /\.(mp3|wav|m4a)$/i.test(name) ? "🎵" : "📄";
    el.innerHTML = '<div class="transfer-icon">' + icon + '</div><div class="transfer-body"><div class="fname">' + escapeHtml(name) + '</div><div class="fmeta">' + direction + ' · ' + sizeLabel(size) + '</div><div class="progress"><i style="width:' + (progress || 0) + '%"></i></div></div><span class="dl-slot"></span>';
    transfersEl.prepend(el);
    return {
      setProgress(p) { const bar = el.querySelector(".progress > i"); if (bar) bar.style.width = Math.min(100, p) + "%"; },
      done(url) {
        this.setProgress(100);
        const slot = el.querySelector(".dl-slot");
        if (url && slot) { const a = document.createElement("a"); a.className = "dl"; a.href = url; a.download = name; a.textContent = "保存"; slot.appendChild(a); }
        el.querySelector(".fmeta").textContent = direction + " · 完了 · " + sizeLabel(size);
      }
    };
  }
  function sendFiles(fileList) {
    const files = Array.from(fileList || []);
    if (!files.length) return;
    if (!peers.size) { toast("先に相手と接続してください"); return; }
    files.forEach((file) => {
      if (file.size > MAX) { toast(file.name + " は大きすぎます（目安6MB以下）"); return; }
      const tx = addTransfer({ name: file.name, size: file.size, direction: "送信中", progress: 10 });
      const reader = new FileReader();
      reader.onprogress = (e) => { if (e.lengthComputable) tx.setProgress(10 + (e.loaded / e.total) * 70); };
      reader.onload = () => {
        tx.setProgress(85);
        const payload = JSON.stringify({ t: "file", name: file.name, size: file.size, mime: file.type || "application/octet-stream", data: reader.result, from: myName });
        peers.forEach((p) => { if (p.conn && p.conn.open) { try { p.conn.send(payload); } catch (_) {} } });
        tx.done(reader.result); toast("送信しました: " + file.name);
      };
      reader.onerror = () => toast("読み込みに失敗しました");
      reader.readAsDataURL(file);
    });
  }
  function receiveFile(msg, fromId) {
    const p = peers.get(fromId);
    const from = (p && p.name) || msg.from || "相手";
    const tx = addTransfer({ name: msg.name || "file", size: msg.size || 0, direction: from + " から受信", progress: 100 });
    tx.done(msg.data); toast("受信: " + (msg.name || "ファイル"));
  }

  $("#btn-host").onclick = () => enter(code(6));
  const q = new URLSearchParams(location.search).get("room");
  if (q && q.length >= 4) {
    $("#btn-join").style.display = "block";
    $("#btn-join").textContent = "部屋 " + q.toUpperCase() + " に接続";
    $("#btn-join").onclick = () => enter(q.toUpperCase().replace(/[^A-Z0-9]/g, ""));
  }
  drop.onclick = () => fileInput.click();
  fileInput.onchange = () => { sendFiles(fileInput.files); fileInput.value = ""; };
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("drag"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("drag"));
  drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("drag"); sendFiles(e.dataTransfer.files); });
  $("#btn-copy").onclick = async () => {
    try { await navigator.clipboard.writeText(location.href); toast("リンクをコピーしました"); }
    catch { prompt("コピーしてください", location.href); }
  };
  $("#btn-leave").onclick = () => {
    destroy(); share.style.display = "none"; lobby.style.display = "flex";
    const u = new URL(location.href); u.searchParams.delete("room"); history.replaceState(null, "", u.pathname);
  };
})();
  </script>
</body>
</html>
