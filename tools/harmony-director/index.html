<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harmony Director | HD-300 / HD-200 Simulator</title>
  <meta name="description" content="Yamaha Harmony Director HD-300 / HD-200 high-fidelity web simulator">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/panel.css">
  <link rel="stylesheet" href="css/keyboard.css">
  <link rel="stylesheet" href="css/lcd.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="model-hd300">
  <div id="app">
    <header class="app-header">
      <div class="brand">
        <span class="logo">YAMAHA</span>
        <span class="product-name">HARMONY DIRECTOR</span>
      </div>
      <div class="model-switcher">
        <button id="btn-hd200" class="model-btn" data-model="HD-200">HD-200</button>
        <button id="btn-hd300" class="model-btn active" data-model="HD-300">HD-300</button>
      </div>
      <div class="header-actions">
        <span class="model-badge" id="model-badge">HD-300</span>
        <button id="btn-midi" class="icon-btn" title="Web MIDI">MIDI</button>
      </div>
    </header>

    <main class="device-chassis" id="device">
      <!-- TOP BAR: Power + Main controls -->
      <div class="chassis-top">
        <button id="btn-power" class="power-btn active" title="Power">⏻</button>
        <div class="vol-group">
          <label>MAIN</label>
          <input type="range" id="main-vol" min="0" max="100" value="72" class="slider-h">
        </div>
        <div class="vol-group">
          <label>BALANCE</label>
          <input type="range" id="balance" min="0" max="100" value="40" class="slider-h">
        </div>
        <div class="lcd-wrap">
          <div class="lcd" id="lcd">
            <div class="lcd-line">
              <span id="lcd-voice">PIANO</span>
              <span id="lcd-pitch">A=440.0</span>
              <span id="lcd-cent">+0.0c</span>
            </div>
            <div class="lcd-line">
              <span id="lcd-temp">EQUAL</span>
              <span id="lcd-root">C</span>
              <span id="lcd-key">Major</span>
              <span id="lcd-transpose">T+0</span>
            </div>
            <div class="lcd-line big">
              <span id="lcd-tempo">♩ = 120</span>
              <span id="lcd-beat">4/4</span>
              <span id="lcd-mem">M1</span>
            </div>
            <div class="lcd-line dim">
              <span id="lcd-status">READY</span>
              <span id="lcd-poly">Poly 0</span>
            </div>
          </div>
        </div>
        <div class="dial-group">
          <label>DATA</label>
          <input type="range" id="data-dial" min="0" max="100" value="50" class="dial">
        </div>
      </div>

      <!-- MIDDLE: Function panels -->
      <div class="chassis-mid">
        <!-- VOICE -->
        <section class="panel-block">
          <div class="panel-label">VOICE</div>
          <div class="btn-row">
            <button class="hw-btn voice-btn" data-cat="wood">WOOD</button>
            <button class="hw-btn voice-btn" data-cat="brass">BRASS</button>
            <button class="hw-btn voice-btn" data-cat="organ">ORGAN</button>
            <button class="hw-btn voice-btn active" data-cat="piano">PIANO</button>
          </div>
          <select id="voice-select" class="hw-select"></select>
          <div class="btn-row hd200-only figure-row">
            <label>ATK</label><input type="range" id="fig-attack" min="0" max="100" value="30" class="slider-mini">
            <label>REL</label><input type="range" id="fig-release" min="0" max="100" value="40" class="slider-mini">
            <label>BRI</label><input type="range" id="fig-brill" min="0" max="100" value="50" class="slider-mini">
          </div>
        </section>

        <!-- TEMPERAMENT -->
        <section class="panel-block">
          <div class="panel-label">TEMPERAMENT</div>
          <div class="btn-row">
            <button class="hw-btn temp-btn active" data-temp="equal">EQUAL</button>
            <button class="hw-btn temp-btn" data-temp="pure-major">PURE MAJ</button>
            <button class="hw-btn temp-btn" data-temp="pure-minor">PURE MIN</button>
            <button class="hw-btn temp-btn" data-temp="individual">INDIV</button>
          </div>
          <div class="btn-row">
            <button id="btn-lock" class="hw-btn">LOCK</button>
            <button id="btn-auto-root" class="hw-btn active">AUTO</button>
          </div>
        </section>

        <!-- TRANSPOSE / OCTAVE -->
        <section class="panel-block">
          <div class="panel-label">TRANSPOSE / OCTAVE</div>
          <div class="btn-row">
            <button class="hw-btn trans-preset" data-trans="0">C</button>
            <button class="hw-btn trans-preset" data-trans="-2">B♭</button>
            <button class="hw-btn trans-preset" data-trans="-9">E♭</button>
            <button class="hw-btn trans-preset" data-trans="-5">F</button>
          </div>
          <div class="btn-row">
            <button id="btn-trans-down" class="hw-btn">−</button>
            <span id="trans-display" class="value-readout">0</span>
            <button id="btn-trans-up" class="hw-btn">+</button>
          </div>
          <div class="btn-row">
            <label>OCT</label>
            <input type="range" id="octave" min="-2" max="2" value="0" step="1" class="slider-h">
            <span id="octave-display" class="value-readout">0</span>
          </div>
        </section>

        <!-- PITCH / HOLD / SOUND BACK -->
        <section class="panel-block">
          <div class="panel-label">PITCH / HOLD</div>
          <div class="btn-row">
            <label>REF</label>
            <input type="range" id="ref-pitch" min="4300" max="4503" value="4400" step="1" class="slider-h">
            <span id="pitch-display" class="value-readout">440.0</span>
          </div>
          <div class="btn-row">
            <button id="btn-hold" class="hw-btn">HOLD</button>
            <button id="btn-soundback" class="hw-btn">SOUND BACK</button>
          </div>
          <div class="btn-row hd300-only">
            <button id="btn-rec" class="hw-btn danger">● REC</button>
            <button id="btn-play" class="hw-btn">▶ PLAY</button>
            <button id="btn-training" class="hw-btn">TRAINING</button>
          </div>
        </section>

        <!-- METRONOME -->
        <section class="panel-block metro-block">
          <div class="panel-label">METRONOME</div>
          <div class="btn-row">
            <button id="btn-metro-start" class="hw-btn accent">START</button>
            <button id="btn-tap" class="hw-btn">TAP</button>
            <input type="number" id="tempo-input" min="32" max="280" value="120" class="tempo-input">
          </div>
          <div class="btn-row">
            <select id="ref-note" class="hw-select compact">
              <option value="8">♪ 8th</option>
              <option value="4" selected>♩ 4th</option>
              <option value="dotted4">♩. dotted</option>
            </select>
            <select id="metro-sound" class="hw-select compact">
              <option value="peck">Peck</option>
              <option value="click">Click</option>
              <option value="beep">Beep</option>
            </select>
            <select id="metro-pattern" class="hw-select compact">
              <option value="all">All</option>
              <option value="alternate">Alternate</option>
            </select>
          </div>
          <div class="metro-vols">
            <div class="mv"><span>Acc</span><input type="range" class="metro-note-vol" data-beat="0" min="0" max="100" value="90" orient="vertical"></div>
            <div class="mv"><span>2</span><input type="range" class="metro-note-vol" data-beat="1" min="0" max="100" value="55" orient="vertical"></div>
            <div class="mv"><span>3</span><input type="range" class="metro-note-vol" data-beat="2" min="0" max="100" value="55" orient="vertical"></div>
            <div class="mv"><span>4</span><input type="range" class="metro-note-vol" data-beat="3" min="0" max="100" value="55" orient="vertical"></div>
            <div class="mv"><span>5</span><input type="range" class="metro-note-vol" data-beat="4" min="0" max="100" value="40" orient="vertical"></div>
          </div>
        </section>
      </div>

      <!-- KEYBOARD -->
      <section class="keyboard-section">
        <div class="keyboard" id="keyboard"></div>
      </section>
    </main>

    <footer class="app-footer">
      <span>Harmony Director Simulator · Educational / Non-commercial · Not affiliated with Yamaha Corporation</span>
      <span id="polyphony-display">Poly: 0 / 48</span>
    </footer>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
