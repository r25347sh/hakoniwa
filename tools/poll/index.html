<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>簡易投票 | HAKONIWA</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml"/>
<style>
:root{--bg:#f3f6ee;--card:#fff;--text:#2a3528;--muted:#6a7a64;--accent:#4a9a5a;--border:rgba(60,90,50,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:1.25rem;max-width:560px;margin:0 auto}
a.back{color:var(--muted);text-decoration:none;font-size:.9rem}
h1{font-size:1.35rem;margin:1rem 0 .75rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.25rem;box-shadow:0 8px 28px rgba(40,60,30,.06);margin-bottom:1rem}
button{font:inherit;cursor:pointer;border:none;border-radius:999px;padding:.7rem 1.2rem;background:var(--accent);color:#fff;font-weight:600}
button.ghost{background:#fff;color:var(--text);border:1px solid var(--border)}
input,textarea{width:100%;padding:.65rem .85rem;border:1px solid var(--border);border-radius:10px;font:inherit;margin:.35rem 0}
.row{display:flex;flex-wrap:wrap;gap:.5rem;margin:.5rem 0}
.muted{color:var(--muted);font-size:.88rem}
</style>
</head>
<body>
<a class="back" href="../../">← HAKONIWA</a>
<h1>簡易投票</h1>
<div class="card">
  <label class="muted">質問</label>
  <input id="q" value="今日の気分は？"/>
  <label class="muted">選択肢（1行1つ）</label>
  <textarea id="opts" rows="4">良い\nふつう\nつかれた</textarea>
  <div class="row"><button id="start">投票スタート</button><button class="ghost" id="reset">リセット</button></div>
</div>
<div class="card" id="board" style="display:none"></div>
<script>
const KEY="hakoniwa-poll";
function render(state){
  const b=document.getElementById("board");b.style.display="block";
  const total=state.votes.reduce((a,c)=>a+c,0)||1;
  b.innerHTML="<h2 style=\"font-size:1.1rem;margin-bottom:.75rem\">"+state.q+"</h2>"+
    state.opts.map((o,i)=>`<div style="margin:.6rem 0"><button data-i="${i}" style="width:100%;text-align:left;background:#eef5ea;color:var(--text)">${o} <strong>${state.votes[i]}</strong></button>
    <div style="height:8px;background:#e8eee4;border-radius:4px;margin-top:4px"><div style="height:100%;width:${state.votes[i]/total*100}%;background:var(--accent);border-radius:4px"></div></div></div>`).join("");
  b.querySelectorAll("button[data-i]").forEach(btn=>btn.onclick=()=>{state.votes[+btn.dataset.i]++;localStorage.setItem(KEY,JSON.stringify(state));render(state)});
}
document.getElementById("start").onclick=()=>{
  const opts=document.getElementById("opts").value.split(/\n/).map(s=>s.trim()).filter(Boolean);
  if(opts.length<2)return alert("選択肢を2つ以上");
  const state={q:document.getElementById("q").value,opts,votes:opts.map(()=>0)};
  localStorage.setItem(KEY,JSON.stringify(state));render(state);
};
document.getElementById("reset").onclick=()=>{localStorage.removeItem(KEY);document.getElementById("board").style.display="none"};
const saved=localStorage.getItem(KEY);if(saved)try{render(JSON.parse(saved))}catch{}
</script>
</body>
</html>
