<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — 道に迷いました | HAKONIWA</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Shippori+Mincho:wght@700&display=swap" rel="stylesheet" />
  <style>
    .err-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
      position: relative;
      z-index: 1;
    }
    .err-code {
      font-family: "Shippori Mincho", serif;
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, #7cb87c, #c4a574);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      letter-spacing: 0.05em;
    }
    .err-title {
      font-family: "Shippori Mincho", serif;
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
    }
    .err-desc {
      color: #8a9488;
      max-width: 22em;
      margin: 0 auto 2rem;
      font-size: 0.95rem;
    }
    .err-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }
    .err-moss {
      position: absolute;
      bottom: 12%;
      width: 120px;
      height: 40px;
      background: radial-gradient(ellipse, rgba(124,184,124,0.2), transparent 70%);
      border-radius: 50%;
      filter: blur(8px);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
  </div>
  <div class="err-page">
    <div class="err-code">404</div>
    <h1 class="err-title">この道には、何もありません</h1>
    <p class="err-desc">
      箱庭の外へ出てしまったようです。<br />
      ホームに戻って、もう一度庭を歩きましょう。
    </p>
    <div class="err-actions">
      <a href="./" class="btn btn-primary">ホームへ戻る</a>
      <a href="tools/blackboard/bb.html" class="btn btn-ghost">黒板を開く</a>
    </div>
    <div class="err-moss" aria-hidden="true"></div>
  </div>
</body>
</html>
